<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G-Adwa | مختبر الاستثمار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#235f8c;--bg2:#265f8b;--panel:#2f73a3;--line:#5d9bc6;--line2:#98c8e8;--ink:#f6fafd;--dim:#e2eff9;--amber:#f4b23e;--mint:#3ccfa0;--coral:#ff9a8f;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',Tahoma,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;min-height:100vh;
 background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:32px 32px;
 padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1160px;margin:0 auto;padding:14px 14px 60px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.brand{font-weight:800;font-size:1.15rem}.brand small{font-weight:400;color:var(--dim);margin-inline-start:8px;font-size:.85rem}
.tb{display:flex;gap:8px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 14px;color:var(--dim);font-size:.9rem}
.ghost:hover{border-color:var(--line2);color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:1rem;margin-bottom:8px}
h1{font-size:clamp(1.7rem,5vw,2.8rem);line-height:1.25;font-weight:800;max-width:20ch}
.lead{color:var(--dim);max-width:62ch;margin:10px 0 18px}
.cta{display:inline-block;background:var(--amber);color:#1b2a38;border:0;border-radius:12px;padding:11px 26px;font-weight:800;font-size:1.05rem;text-decoration:none}
.cta:hover{filter:brightness(1.07)}.cta.sec{background:none;color:var(--ink);border:1px solid var(--line2);font-weight:600}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.note{color:var(--dim);font-size:.82rem}
.tag{display:inline-block;border-radius:999px;padding:1px 12px;font-size:.8rem;font-weight:600;margin-bottom:6px}
.t-neg{background:rgba(255,107,94,.16);color:var(--coral)}.t-pos{background:rgba(60,207,160,.16);color:var(--mint)}.t-neu{background:rgba(244,178,62,.16);color:var(--amber)}
.pos{color:var(--mint)}.neg{color:var(--coral)}

/* setup */
.setup{display:grid;grid-template-columns:1fr 350px;gap:14px;align-items:start}
@media(max-width:900px){.setup,.gcols{grid-template-columns:1fr!important}}
.steps{display:grid;gap:14px}
.ocs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.oc{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:start}
.oc b{display:block}.oc small{color:var(--dim);display:block;font-size:.8rem;line-height:1.5}
.oc.on{border-color:var(--amber);background:rgba(244,178,62,.08)}.oc.on b{color:var(--amber)}
.oc.off{opacity:.45;cursor:not-allowed}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.ed label{font-size:.78rem;color:var(--dim);display:block}
.ed input,.num{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--ink);font:inherit}
.unc{color:var(--amber);font-size:.7rem;margin-inline-start:4px}
.sl{margin:10px 0}.sl label{display:flex;justify-content:space-between;font-weight:600;font-size:.92rem}.sl label span{color:var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber);height:26px}
.seg{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 6px;font-size:.88rem}
.seg button.on{border-color:var(--amber);color:var(--amber);background:rgba(244,178,62,.1)}
.sub{font-size:.88rem;color:var(--dim);font-weight:600;margin-top:12px}
.sum{position:sticky;top:10px}
.rows{width:100%;border-collapse:collapse;margin:6px 0}.rows td{padding:4px 0;border-bottom:1px solid var(--line);font-size:.9rem}.rows td:last-child{text-align:end}
.rows tr.tot td{font-weight:800;border-bottom:0}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.kp div{background:var(--bg2);border-radius:10px;padding:7px 10px}
.kp small{display:block;color:var(--dim);font-size:.76rem}.kp b{font-size:1.1rem;font-weight:800}
.warn{background:rgba(244,178,62,.1);border:1px solid var(--amber);border-radius:10px;padding:6px 10px;font-size:.84rem;margin:8px 0}

/* game */
.hdr{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.clock{font-weight:800;font-size:1.15rem}.stg{color:var(--amber);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.88rem}
.chip.bad{border-color:var(--coral);color:var(--coral)}
.scene{padding:0;overflow:hidden;position:relative}
.scene svg{display:block;width:100%;height:auto}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.ctl button{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 14px;font-size:.92rem}
.ctl button:hover:not(:disabled){border-color:var(--amber)}.ctl button:disabled{opacity:.4;cursor:not-allowed}
.ctl .play{background:var(--amber);color:#1b2a38;font-weight:800;border-color:var(--amber)}
.ctl .on{border-color:var(--amber);color:var(--amber)}
.sep{flex:1}
.gcols{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px;align-items:start}
.stack{display:grid;gap:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--bg2);border-radius:10px;padding:7px 10px}.tile small{display:block;color:var(--dim);font-size:.75rem}.tile b{font-size:1.02rem}
.fa{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.fa button{background:none;border:1px dashed var(--line2);border-radius:9px;padding:2px 10px;font-size:.82rem}.fa button:disabled{opacity:.35;cursor:not-allowed}
.gantt{display:grid;grid-template-columns:96px 1fr;gap:5px 8px;align-items:center;font-size:.8rem}
.gantt .tr{position:relative;height:18px;background:rgba(0,0,0,.18);border-radius:4px;direction:ltr}
.gantt .b{position:absolute;top:0;height:100%;border-radius:4px}
.b.pl{border:1.5px solid var(--dim);background:none;height:56%;top:22%}
.b.ac{background:var(--mint)}.b.ac.late{background:var(--coral)}
.b.fc{background:repeating-linear-gradient(45deg,rgba(244,178,62,.55) 0 4px,rgba(244,178,62,.2) 4px 8px)}
.gantt .td{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.8}
.gantt .lb{display:flex;justify-content:space-between;gap:4px}.dl{font-size:.7rem}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--dim);margin-top:6px}.leg i{display:inline-block;width:16px;height:3px;margin-inline-end:4px;vertical-align:middle;border-radius:2px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{background:none;border:1px solid var(--line);border-radius:999px;padding:1px 14px;font-size:.85rem}.tabs button.on{border-color:var(--amber);color:var(--amber)}
.logs{max-height:420px;overflow:auto;display:grid;gap:8px}
.le{background:var(--bg2);border-radius:10px;padding:8px 10px;font-size:.86rem}.le b{display:block}.le small{color:var(--dim);display:block}
.le .alt{display:flex;justify-content:space-between;gap:8px;font-size:.8rem}.le .alt.ch{color:var(--amber);font-weight:600}
.tl{display:grid;gap:4px;max-height:420px;overflow:auto;font-size:.84rem}.tl div{border-bottom:1px solid var(--line);padding:3px 0}.tl small{color:var(--dim);margin-inline-end:6px}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,20,34,.72);backdrop-filter:blur(3px);z-index:20;padding:14px}
#modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.mbox h2{font-size:1.3rem;line-height:1.4;margin-bottom:4px}.mbox p{color:var(--dim);margin-bottom:10px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.facts div{background:var(--bg2);border-radius:10px;padding:6px 10px;font-size:.8rem;color:var(--dim)}.facts b{display:block;color:var(--ink);font-size:.98rem}
.opt{display:block;width:100%;text-align:start;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-top:8px}
.opt:hover:not(:disabled){border-color:var(--amber)}.opt:disabled{opacity:.45;cursor:not-allowed}.opt b{display:block}.opt span{color:var(--dim);font-size:.86rem}
#toasts{position:fixed;inset-inline-start:12px;bottom:12px;display:grid;gap:6px;z-index:15;max-width:320px}
.ts{background:var(--bg2);border:1px solid var(--amber);border-radius:10px;padding:6px 12px;font-size:.86rem;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* results */
.verdict{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:800;line-height:1.3;margin:4px 0}
.cmp{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0}
.cmp>div{padding:7px 9px;border-bottom:1px solid var(--line);font-size:.88rem}.cmp .h{background:var(--bg2);font-weight:800;text-align:center}.cmp .l{color:var(--dim)}.cmp .v{text-align:center}.cmp .a{background:rgba(244,178,62,.07)}
.why{display:grid;gap:8px;margin-top:8px}.why div{background:var(--bg2);border-radius:10px;padding:8px 12px;font-size:.9rem}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.disc{color:var(--dim);font-size:.78rem;margin-top:18px;max-width:80ch}
/* scene */
.g{opacity:0;transition:opacity .6s;pointer-events:none}.g.on{opacity:1}
@keyframes belt{from{transform:translateX(0)}to{transform:translateX(300px)}}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:.6}100%{transform:translateY(-40px) scale(1.7);opacity:0}}
@keyframes pace{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes drive{from{transform:translateX(-120px)}to{transform:translateX(1060px)}}
@keyframes cloud{from{transform:translateX(-200px)}to{transform:translateX(1160px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-24px)}}
@keyframes flag{0%,100%{transform:skewY(-6deg)}50%{transform:skewY(6deg)}}
.bx{animation:belt var(--bs,3s) linear infinite}.sm{animation:smoke 3s ease-out infinite}
.pace{animation:pace 3s ease-in-out infinite alternate}.drive{animation:drive 16s linear infinite}
.cloud{animation:cloud 90s linear infinite}.blink{animation:blink .9s infinite}.hook{animation:swing 3s ease-in-out infinite;transform-origin:520px 112px}
.wv{animation:wave 3s linear infinite}.flg{animation:flag 1.6s ease-in-out infinite;transform-origin:left center;transform-box:fill-box}
@media(prefers-reduced-motion:reduce){.bx,.sm,.pace,.drive,.cloud,.blink,.hook,.wv,.flg{animation:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="brand">G-Adwa<small id="sub"></small></div>
  <div class="tb"><button class="ghost" id="homeBtn" hidden></button><button class="ghost" id="langBtn"></button></div></div>
 <div id="app"></div>
</div>
<div id="modal"></div><div id="toasts"></div>

<script>

let LANG='ar';
const S=(ar,en)=>LANG==='ar'?ar:en;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const clone=o=>JSON.parse(JSON.stringify(o));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const n=x=>'<span class="n">'+x+'</span>';

  const t=a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?Math.round(a/1e3)+'K':String(Math.round(a));return n(sg+CUR.cur+' '+t)}
const pcs=x=>x==null?'—':n((x*100).toFixed(1)+'%');
const yrs=x=>x==null?S('لا يُسترد خلال 7 سنوات','Not within 7 yrs'):n(x.toFixed(1))+' '+S('سنة','yr');

function both(fn){const k=LANG;LANG='ar';const a=fn();LANG='en';const b=fn();LANG=k;return {ar:a,en:b}}
const P2=o=>o[LANG];

const DAYS=30,HORIZON=2520,ENDDAY=1080;
const MNT={low:{c:0.6,fail:1.5,def:0.004},std:{c:1,fail:1,def:0},high:{c:1.5,fail:0.65,def:-0.003}};
const PR=c=>PROJECTS[c.project];
const SC=s=>{const p=PROJECTS[s.cfg.project];return p.scns[s.cfg.scenario]||p.scns.base};
const K=s=>PROJECTS[s.cfg.project].k;
const T=(s,k)=>{const o=PROJECTS[s.cfg.project].t[k];return LANG==='ar'?o.ar:o.en};
const B=(ar,en)=>({ar:ar,en:en});

const PROJECTS={
/* ---------------- مصنع مستلزمات طبية ---------------- */
med:{id:'med',scene:'factory',k:1,
 name:B('مصنع مستلزمات طبية','Medical supplies factory'),
 sub:B('السوق السعودي • الوحدة = علبة مستلزمات طبية استهلاكية','Saudi market • unit = a box of disposable medical supplies'),
 refDemand:1000000,price:15,varCost:9,adminM:35000,utilM:12000,trialD:45,trialDef:0.22,rampDays:120,ramp0:0.4,
 stockDays:20,matShare:0.7,defBase:0.03,trialShare:0.3,trialSell:0,eqDelay:90,eqOff:[45,90],licDelay:45,trialAdd:[6,21],

 priceRange:[10,20,0.5],costRange:[6,12,0.5],

 lab:{lean:{m:65000,cap:0.94,def:0.005},std:{m:85000,cap:1,def:0},ext:{m:110000,cap:1.06,def:-0.003}},
 qc:{low:{c:6000,def:0.015,aud:1.6},std:{c:12000,def:0,aud:1},high:{c:20000,def:-0.01,aud:0.5}},
 ep:{},
 t:{unit:B('علبة','box'),line:B('خط الإنتاج','production line'),works:B('أعمال الموقع','site works'),defect:B('المنتجات المعيبة','defective units'),trial:B('التشغيل التجريبي','trial run'),mat:B('الخامات','raw materials'),
  lineStep:B('1. خط الإنتاج','1. Production line'),siteStep:B('2. موقع المشروع','2. Site'),lineSum:B('خط الإنتاج (شراء + شحن + تركيب)','Line (purchase + shipping + install)'),siteSum:B('الموقع (تجهيز / إنشاء)','Site (fit-out / build)'),
  priceLbl:B('سعر بيع العلبة','Selling price per box'),costLbl:B('تكلفة العلبة المتغيرة','Variable cost per box'),capLbl:B('الطاقة السنوية (علبة)','Capacity (boxes/yr)'),failLbl:B('أعطال متوقعة / سنة','Failures per year'),

  cn:{name:B('خط إنتاج صيني','Chinese production line'),price:2500000,ship:200000,inst:300000,instD:35,lead:150,cap:1000000,maintM:12000,life:10,warr:12,fail:2.0,express:180000},

  build:{name:B('إنشاء مصنع جديد','Build a new factory'),permitD:120,civilD:180,civil:2000000,rent:0,bldgM:8000,depY:25,preop:300000,utilMult:1,dem:1,capm:1,ovr:0.12}},
 scns:{
  base:{name:B('أساسي','Base case'),desc:B('ظروف سوق متوازنة وأحداث بمعدلاتها الطبيعية.','Balanced market and normal event odds.'),p:1,pos:1,sev:1},
  boom:{name:B('طلب قوي','Strong demand'),desc:B('طلب مرتفع وفرص أكثر، ومخاطر أقل قليلًا.','Higher demand and more opportunities, slightly fewer risks.'),p:0.8,pos:1.3,sev:0.9,demand:1.08},
  supply:{name:B('اضطراب الإمدادات','Supply disruption'),desc:B('تأخر شحنات وتراخيص وارتفاع خامات.','Late shipments and permits, rising materials.'),p:1.1,pos:0.9,sev:1.15,eb:{eqDelay:1.7,lic:1.4,matRise:1.7}},
  price:{name:B('ضغط أسعار ومنافسة','Price pressure'),desc:B('منافسون بأسعار أقل وعملاء يتأخرون في السداد.','Cheaper rivals and slow-paying customers.'),p:1.05,pos:0.9,sev:1.1,demand:0.95,eb:{rival:1.8,clientDelay:1.5}},
  regs:{name:B('رقابة صارمة','Strict oversight'),desc:B('تدقيق جودة وتسجيل منتجات وعيوب في التجريب.','Quality audits, product registration and trial defects.'),p:1.05,pos:0.9,sev:1.1,eb:{audit:1.8,reg:1.8,trialDef:1.4}}}},

/* ---------------- مطعم / كوفي شوب ---------------- */
cafe:{id:'cafe',scene:'cafe',k:0.15,
 name:B('مطعم / كوفي شوب','Restaurant / coffee shop'),
 sub:B('السوق السعودي • الوحدة = طلب زبون','Saudi market • unit = a customer order'),
 refDemand:120000,price:40,varCost:14,adminM:12000,utilM:14000,trialD:21,trialDef:0.15,rampDays:180,ramp0:0.35,

const ADD={defect:1,collect:1,pay:1,xfix:1};
function addMod(s,k,v,days){s.mods.push({k:k,v:v,until:days==null?1e9:s.d+days,op:ADD[k]?'add':'mul'})}
const opex=(s,a)=>{s.oneOpex+=a};
function capexAdd(s,a,kind){s.oneCapex+=a;if(kind==='site')s.capSite+=a;else s.capEq+=a}
function borrow(s,a,rate){s.tlRate=(s.debt*s.tlRate+a*rate)/(s.debt+a);s.debt+=a;s.tlAmt+=a;s.cash+=a}
function inject(s,a){s.cash+=a;s.equityAdded+=a}
function repayX(s,a){a=Math.min(a,s.debt,s.cash);if(a>0){s.debt-=a;s.tlAmt=Math.max(0,s.tlAmt-a);s.cash-=a}}
const needOf=c=>c.line.price+c.line.ship+c.line.inst+c.site.civil+c.site.preop+c.reserve;

function init(cfg,plan,seed){
  const pr=PR(cfg),L=cfg.line,ST=cfg.site,c0=Math.max(needOf(cfg),cfg.loan);
  const s={cfg:cfg,d:0,plan:!!plan,noEv:!!plan,quiet:false,dead:false,
   cash:c0,od:0,debt:cfg.loan,tlAmt:cfg.loan,tlRate:cfg.loanRate,odRate:0.12,graceEnd:360,
   ms:{permitDone:null,civilStart:null,civilDone:null,arrived:null,instStart:null,instDone:null,trialStart:null,trialDone:null,comm:null},
   prog:{permit:0,civil:0,inst:0,trial:0},dur:{permit:ST.permitD,civil:ST.civilD,inst:L.instD,trial:pr.trialD},
   arrDay:L.lead,extra:0,pauseCivil:0,interim:null,mods:[],sched:[],oneOpex:0,oneCapex:0,oneIn:0,
   ar:0,ap:0,stock:0,stockVal:0,nol:0,trialDef:pr.trialDef+pr.qc[cfg.qc].def,
   capEq:0,capSite:0,depEqAcc:0,depSiteAcc:0,preopSpent:0,preopP:0,rampStart:null,
   m:{rev:0,cogs:0,scrap:0,fixed:0,preop:0,opex:0,dep:0,int:0},mflow:0,hist:[],flows:[],out30:0,
   equityAdded:0,peakOD:0,minLiq:c0,warrExtra:0,nextLiq:0,evs:{},pendingEvent:null,cur:null,notes:[],
   mode:'none',prodToday:false,haltNow:false,expr:false,lastRev:0};
  if(!plan){const sc=pr.scns[cfg.scenario]||pr.scns.base,r=rng(seed||1);
    EVENTS.forEach(e=>{if(e.pj&&e.pj.indexOf(cfg.project)<0)return;
      if(e.state){s.evs[e.id]={occ:true,done:false,p:1};return}
      const a=r(),b=r(),pm=e.kind==='pos'?sc.pos:sc.p,eb=(sc.eb&&sc.eb[e.id])||1,ep=(pr.ep&&pr.ep[e.id])||1;
      const p=Math.min(0.95,e.prob(s)*pm*eb*ep);s.evs[e.id]={occ:a<p,r2:b,due:null,done:false,p:p}});
    if(sc.demand&&sc.demand!==1)addMod(s,'demand',sc.demand,null);
    if(sc.price&&sc.price!==1)addMod(s,'price',sc.price,null)}
  return s}

function eff(s){const e={price:1,demand:1,cost:1,energy:1,fixed:1,cap:1,halt:1,defect:0,collect:0,pay:0,xfix:0},keep=[];
  for(const x of s.mods){if(x.until>s.d){keep.push(x);if(x.op==='add')e[x.k]+=x.v;else e[x.k]*=x.v}}
  s.mods=keep;return e}

function tick(s){
  const cfg=s.cfg,L=cfg.line,ST=cfg.site,pr=PR(cfg),lab=pr.lab[cfg.labor],mn=MNT[cfg.maint],qc=pr.qc[cfg.qc],tx=MARKETS[cfg.market].tax;
  s.d++;const d=s.d,e=eff(s),ms=s.ms;
  const f={coll:0,supp:0,varc:0,fixed:0,preop:0,capex:0,one:0,int:0,tax:0,fin:0};
  let dep=0,rev=0,cogs=0,scrapC=0,oneO=0;
  const nt=k=>{if(!s.quiet)s.notes.push({d:d,k:k})};
  if(s.oneOpex){f.one+=s.oneOpex;oneO+=s.oneOpex;s.oneOpex=0}
  if(s.oneCapex){f.capex+=s.oneCapex;s.oneCapex=0}
  if(s.oneIn){f.coll+=s.oneIn;s.oneIn=0}
  if(s.sched.length){const keep=[];for(const x of s.sched){if(x.d<=d){if(x.k==='capex'){f.capex+=x.amt;s.capSite+=x.amt}else{f.one+=x.amt;oneO+=x.amt}}else keep.push(x)}s.sched=keep}
  if(d===1){const c=L.price*0.3;f.capex+=c;s.capEq+=c}
  if(ms.arrived===null&&d>=s.arrDay){ms.arrived=d;const c=L.price*0.6+L.ship;f.capex+=c;s.capEq+=c;nt('arrived')}
  if(s.prog.permit<1){
    s.prog.permit=Math.min(1,s.prog.permit+1/s.dur.permit);
    const pc=Math.min(ST.preop*0.5-s.preopP,ST.preop*0.5/ST.permitD);if(pc>0){f.preop+=pc;s.preopP+=pc}
    if(s.prog.permit>=1){ms.permitDone=d;nt('permitDone')}
  }else if(ms.civilDone===null&&s.pauseCivil<=d){
    if(ms.civilStart===null){ms.civilStart=d;nt('civilStart')}
    const rem=1-s.prog.civil,g=Math.min(rem,1/s.dur.civil),ex=rem>0?s.extra*(g/rem):0;s.extra-=ex;
    const c=ST.civil*g+ex;f.capex+=c;s.capSite+=c;s.prog.civil+=g;
    if(s.prog.civil>=0.99999){s.prog.civil=1;ms.civilDone=d;nt('civilDone')}
  }
  if(ms.arrived!==null&&ms.civilDone!==null&&ms.instDone===null){
    if(ms.instStart===null){ms.instStart=d;nt('instStart')}
    const g=Math.min(1-s.prog.inst,1/s.dur.inst);s.prog.inst+=g;const c=L.inst*g;f.capex+=c;s.capEq+=c;f.preop+=ST.preop*0.5*g;
    if(s.prog.inst>=0.99999){s.prog.inst=1;ms.instDone=d;nt('instDone')}
  }
  const inTrial=ms.instDone!==null&&ms.trialDone===null&&d>ms.instDone;
  if(inTrial){
    if(ms.trialStart===null){ms.trialStart=d;nt('trialStart')}
    s.prog.trial=Math.min(1,s.prog.trial+1/s.dur.trial);
    if(s.prog.trial>=1){ms.trialDone=d;const c=L.price*0.1;f.capex+=c;s.capEq+=c;nt('trialDone')}
  }
  let mode='none';
  if(ms.trialDone!==null&&d>ms.trialDone)mode='main';
  else if(inTrial)mode='trial';
  else if(s.interim&&d>=s.interim.ready&&ms.civilDone!==null&&ms.trialStart===null)mode='interim';
  if((mode==='main'||mode==='interim')&&s.rampStart===null){s.rampStart=d;nt(mode==='main'?'prodStart':'interimStart')}
  if(mode==='main'&&ms.prodStart==null){ms.prodStart=d;if(s.rampStart!==d)nt('prodStart')}
  if(mode==='main'&&ms.comm===null&&d-s.rampStart>=pr.rampDays){ms.comm=d;nt('comm')}
  const lc=(L.cap/360)*e.cap*lab.cap*(ST.capm||1);
  const rf=s.rampStart===null?0:pr.ramp0+(1-pr.ramp0)*Math.min(1,(d-s.rampStart)/pr.rampDays);
  const dem0=(pr.refDemand/360)*cfg.target*e.demand*(ST.dem||1);
  let dd=dem0*rf,prod=0,sell=false,dr=pr.defBase+mn.def+qc.def+lab.def+e.defect;
  if(mode==='trial'){
    const capT=lc*pr.trialShare;dd=pr.trialSell>0?dem0*pr.trialSell:0;
    prod=(pr.trialSell>0?Math.min(dd+Math.max(0,(dd*pr.stockDays-s.stock)/15),capT):capT)*e.halt;
    dr=s.trialDef+e.defect;sell=pr.trialSell>0}
  else if(mode==='main'||mode==='interim'){
    const cd=mode==='interim'?lc*s.interim.share:lc,pl=dd+Math.max(0,(dd*pr.stockDays-s.stock)/15);
    prod=Math.min(pl,cd)*e.halt;sell=true;if(mode==='interim')dr+=0.03}
  dr=clamp(dr,0.003,0.6);
  const ms2=pr.matShare,uv=cfg.varCost*(ms2*e.cost+(1-ms2)*e.energy),good=prod*(1-dr),scrap=prod-good;
  s.ap+=prod*cfg.varCost*ms2*e.cost;f.varc+=prod*cfg.varCost*(1-ms2)*e.energy;
  scrapC=scrap*uv;s.stock+=good;s.stockVal+=good*uv;
  if(sell){const sold=Math.min(s.stock,dd),ac=s.stock>0?s.stockVal/s.stock:0;cogs=sold*ac;rev=sold*cfg.price*e.price;s.stock-=sold;s.stockVal-=cogs;s.ar+=rev;if(s.stock<1e-6){s.stock=0;s.stockVal=0}}
  const sp=s.ap/Math.max(1,cfg.payDays+e.pay);s.ap-=sp;f.supp+=sp;
  const cl=s.ar/Math.max(1,cfg.creditDays+e.collect);s.ar-=cl;f.coll+=cl;
  const lf=ms.trialDone!==null?1:ms.trialStart!==null?0.7:mode==='interim'?0.5:ms.instStart!==null?0.4:0.1;
  let fm=pr.adminM+ST.rent+(ms.civilDone!==null?ST.bldgM:0)+lab.m*lf*e.fixed+e.xfix;
  if(ms.instStart!==null)fm+=pr.utilM*ST.utilMult*e.fixed;
  if(ms.trialStart!==null)fm+=L.maintM*mn.c+qc.c;
  if(s.interim&&ms.trialDone===null&&d>=s.interim.ready)fm+=s.interim.rentM;
  const fd=fm/30;f.fixed+=fd;
  if(ms.trialDone!==null&&d>ms.trialDone){const x=s.capEq/(L.life*360);dep+=x;s.depEqAcc+=x}
  if(ms.civilDone!==null){const x=s.capSite/(ST.depY*360);dep+=x;s.depSiteAcc+=x}
  f.int=s.debt*s.tlRate/360+s.od*s.odRate/360;
  const M=s.m;M.rev+=rev;M.cogs+=cogs;M.scrap+=scrapC;M.fixed+=fd;M.preop+=f.preop;M.opex+=oneO;M.dep+=dep;M.int+=f.int;
  s.preopSpent+=f.preop;
  if(d%DAYS===0){
    const pm=M.rev-M.cogs-M.scrap-M.fixed-M.preop-M.opex-M.dep-M.int;let t=0;
    if(pm<0)s.nol+=-pm;else{const u=Math.min(s.nol,pm);s.nol-=u;t=(pm-u)*tx}
    f.tax=t;s.lastTax=t;
    if(d>=s.graceEnd&&s.debt>0){const p=Math.min(s.debt,s.tlAmt/36);f.fin-=p;s.debt-=p;if(s.debt<1)s.debt=0}
    s.pmTmp=pm;
  }
  const flow=f.coll-f.supp-f.varc-f.fixed-f.preop-f.capex-f.one-f.int-f.tax;
  s.cash+=flow+f.fin;s.mflow+=flow;
  if(s.cash<0){const x=-s.cash;s.od+=x;s.cash=0;if(s.od>s.peakOD)s.peakOD=s.od;nt('od')}
  else if(s.od>0&&s.cash>0){const p=Math.min(s.cash,s.od);s.od-=p;s.cash-=p}
  if(s.od>s.peakOD)s.peakOD=s.od;
  if(s.cash-s.od<s.minLiq)s.minLiq=s.cash-s.od;
  if(s.od>cfg.maxOD&&!s.plan&&!s.dead){s.dead=true;nt('dead')}
  s.out30=s.out30*0.967+(f.supp+f.varc+f.fixed+f.int+f.one)*0.033;
  s.mode=mode;s.prodToday=prod>0;s.haltNow=e.halt===0;s.lastRev=rev;
  if(d%DAYS===0){
    s.hist.push({m:d/DAYS,rev:M.rev,profit:s.pmTmp-s.lastTax,flow:s.mflow,cash:s.cash,od:s.od,debt:s.debt,ar:s.ar,ap:s.ap,sv:s.stockVal});
    s.flows.push(s.mflow);s.mflow=0;s.m={rev:0,cogs:0,scrap:0,fixed:0,preop:0,opex:0,dep:0,int:0};
  }
  if(!s.noEv&&!s.pendingEvent){const ev=nextEvent(s);if(ev)s.pendingEvent=ev.id}
}

/* KPIs */
const npvOf=fl=>{const r=Math.pow(1+MARKETS.sa.disc,1/12)-1;return fl.reduce((a,x,t)=>a+x/Math.pow(1+r,t+1),0)};
function irrOf(fl){const f=r=>fl.reduce((a,x,t)=>a+x/Math.pow(1+r,t+1),0);let lo=-0.5,hi=1,flo=f(lo);if(!(flo*f(hi)<0))return null;
  for(let k=0;k<70;k++){const mid=(lo+hi)/2,fm=f(mid);if(flo*fm<=0)hi=mid;else{lo=mid;flo=fm}}return Math.pow(1+(lo+hi)/2,12)-1}
function paybackOf(fl){let c=0;for(let t=0;t<fl.length;t++){const p=c;c+=fl[t];if(c>=0&&t>0&&fl[t]>0)return(t+(-p)/fl[t])/12}return null}
function kpiOf(c){
  const fl=c.flows.slice(),fr=fl.slice();
  const resid=Math.max(0,c.capEq-c.depEqAcc)+Math.max(0,c.capSite-c.depSiteAcc)+Math.max(0,c.ar+c.stockVal-c.ap);
  if(fr.length)fr[fr.length-1]+=resid;
  const sum=(a,k)=>a.reduce((x,h)=>x+h[k],0);
  return {npv:npvOf(fr),irr:irrOf(fr),pb:paybackOf(fl),cum:fl.reduce((a,b)=>a+b,0),rev:sum(c.hist,'rev'),profit:sum(c.hist,'profit'),
   invest:c.capEq+c.capSite+c.preopSpent,peakOD:c.peakOD,extra:c.peakOD+c.equityAdded,minLiq:c.minLiq,prodDay:c.ms.trialDone,ms:c.ms,eq:c.equityAdded}}
function planOf(cfg){const s=init(cfg,true,0);s.quiet=true;while(s.d<HORIZON)tick(s);return s}
function projOf(s){const c=clone(s);c.noEv=true;c.quiet=true;c.pendingEvent=null;c.notes=[];c.plan=true;while(c.d<HORIZON)tick(c);return c}
const kProj=s=>kpiOf(s.dead?s:projOf(s));

function anchorDay(s,a){return a==='order'?0:s.ms[a]}
function nextEvent(s){
  for(const e of EVENTS){
    const st=s.evs[e.id];if(!st||st.done)continue;
    if(e.state){if(s.d>=s.nextLiq&&e.cond(s))return e;continue}
    if(!st.occ)continue;
    if(st.due===null){const a=anchorDay(s,e.anchor);if(a===null)continue;const off=typeof e.off==='function'?e.off(s):e.off;st.due=a+Math.round(off[0]+st.r2*(off[1]-off[0]))}
    if(s.d>=st.due){if(e.cond(s))return e;if(s.d>st.due+40)st.done=true}
  }
  return null}
function startEvent(s){const e=EVENTS.find(x=>x.id===s.pendingEvent);s.evs[e.id].done=true;if(e.state)s.nextLiq=s.d+150;s.cur={id:e.id,d:s.d};if(e.base)e.base(s);return e}
function evalOpt(s,e,k){const c=clone(s);c.quiet=true;c.noEv=true;c.pendingEvent=null;c.notes=[];e.opts[k].fx(c);c.plan=true;while(c.d<HORIZON)tick(c);return kpiOf(c).npv}
function optAvail(s,e,i){const o=e.opts[i];return o.avail?o.avail(s):null}
function bestRun(cfg,seed){
  const s=init(cfg,false,seed);s.quiet=true;
  while(s.d<ENDDAY&&!s.dead){tick(s);
    if(s.pendingEvent){const e=startEvent(s);let bi=-1,bv=-1e18;
      e.opts.forEach((o,i)=>{if(optAvail(s,e,i))return;const v=evalOpt(s,e,i);if(v>bv){bv=v;bi=i}});
      if(bi>=0)e.opts[bi].fx(s);s.pendingEvent=null;s.cur=null}}
  return s}
/*END*/
</script>

function sceneSVG(pid){const sc=PROJECTS[pid||G.run.project].scene;return sc==='cafe'?sceneCafe():sc==='agency'?sceneAgency():sceneFactory()}
function updScene(s,run){
  const on=(id,v)=>{const el=$(id);if(el)el.classList.toggle('on',!!v)};
  const ms=s.ms,st=stageOf(s),civ=s.prog.civil,pr=PR(run),svg=$('sc');if(!svg)return;
  const H=+svg.dataset.h||176;
  const setClip=(id,p)=>{const r=$(id);if(r){r.setAttribute('y',300-H*p);r.setAttribute('height',H*p+1)}};
  setClip('cpSr',civ);setClip('cpWr',ms.civilDone!==null?1:clamp((civ-0.3)/0.7,0,1));
  on('gFence',st<=2);on('gStakes',st===1);on('gSlab',ms.civilStart!==null);on('gSk',ms.civilStart!==null&&ms.civilDone===null);on('gBld',ms.civilStart!==null);
  on('gCrane',st===2);on('gShelf',ms.civilDone!==null);on('gShelf2',ms.civilDone!==null);
  for(let i=0;i<4;i++)on('m'+i,ms.trialStart!==null||s.prog.inst>=(i+1)/4-0.001&&s.prog.inst>0);
  on('gBelt',ms.instDone!==null);on('gInterim',s.mode==='interim');on('gPack',ms.trialStart!==null);on('gScrap',ms.trialStart!==null);
  const util=clamp(run.target*(s.mode==='none'?0:1),0,1);svg.style.setProperty('--bs',(3.4-1.6*util)+'s');
  on('gBoxes',s.prodToday);on('gSmoke',s.prodToday&&s.mode!=='trial');on('gHalt',s.haltNow);
  on('gBeacon',s.mode==='trial'||s.haltNow);const bc=$('bcn');if(bc)bc.setAttribute('fill',s.haltNow?'#ff3b30':'#f4b23e');
  for(let i=0;i<5;i++)on('sb'+i,ms.trialStart!==null&&s.prog.trial>(i+1)/6);
  let lvl;
  if(pr.scene==='agency')lvl=s.rampStart===null?0:clamp(pr.ramp0+(1-pr.ramp0)*Math.min(1,(s.d-s.rampStart)/pr.rampDays),0,1);
  else lvl=clamp(s.stock/((pr.refDemand/360)*run.target*Math.max(pr.stockDays*1.5,3)),0,1);
  const np=Math.ceil(lvl*12-0.001);for(let i=0;i<12;i++)on('p'+i,i<np);
  on('gFlag',st===6);on('gTkA',st===2);on('gTkB',st>=5);on('gTkC',st===6);
  const wn=(pr.scene==='factory'?[0,0,3,3,4,5,6]:[0,0,2,3,3,5,6])[st];for(let i=0;i<6;i++)on('wk'+i,i<wn);
  on('gCrate',ms.arrived!==null&&ms.instDone===null);
  const shipVis=ms.instStart===null&&!(ms.arrived!==null&&s.d-ms.arrived>30);on('gShip',shipVis);
  const L=run.line,tgt=clamp(1-(s.arrDay-s.d)/L.lead,0,1);if(G){G.shipP=Math.max(G.shipP||0,Math.min(tgt,0.92));if(ms.arrived!==null)G.shipP=1}
  const sp=G?G.shipP:1,x=900-150*sp;const sg=$('shipG');if(sg){sg.setAttribute('transform','translate('+x+',0)')}
  on('gAlert',!!(G&&G.modalEv));
}

  $('bPlay').addEventListener('click',()=>G.running?pause():play());
  $('bD').addEventListener('click',()=>stepN(1));$('bM').addEventListener('click',()=>stepN(30));$('bQ').addEventListener('click',()=>stepN(90));

}
function play(){if(G.timer||G.modalEv)return;G.running=true;G.timer=setInterval(loop,100);buildCtl()}

function runDays(k){
  const s=G.s;

}

function drain(){const s=G.s;if(!s.notes.length)return;
  for(const x of s.notes){const t=NOTES[x.k];if(!t)continue;if(x.k==='od'&&G.lastOd&&s.d-G.lastOd<30)continue;if(x.k==='od')G.lastOd=s.d;
    G.tl.push({d:x.d,t:{ar:t[0],en:t[1]},k:x.k});toast(S(t[0],t[1]),x.k)}
  s.notes=[]}

function after(){

  const mh=s.hist.length;if(mh!==G.lastM){G.lastM=mh;refreshK();reviewDecisions()}

function lineChart(series,len){
  const all=series.flatMap(x=>x.v),mx=Math.max(...all,1)*1.08,mn=Math.min(...all,0),W=600,H=170,p=8;
  const X=i=>p+(W-2*p)*i/Math.max(1,len-1),Y=v=>H-p-(H-2*p)*(v-mn)/((mx-mn)||1);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;direction:ltr"><line x1="${p}" x2="${W-p}" y1="${Y(0)}" y2="${Y(0)}" stroke="#4f86b0"/>${series.map(x=>`<polyline fill="none" stroke="${x.c}" stroke-width="${x.w||2.5}" ${x.dash?'stroke-dasharray="7 5"':''} stroke-linejoin="round" points="${x.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`).join('')}</svg>`}
function cumSeries(fl){let c=0;return [0].concat(fl.map(x=>c+=x))}
function chartHTML(){
  const s=G.s,N=ENDDAY/30,pl=G.plan;
  const cashA=[G.run.reserve+0].slice(0,0).concat([s.hist.length?null:null]).slice(0,0);
  const init=Math.max(needOf(G.run),G.run.loan);
  const a=[init].concat(s.hist.map(h=>h.cash-h.od)),b=[init].concat(pl.hist.slice(0,N).map(h=>h.cash-h.od));
  return lineChart([{v:b,c:'#9db9cf',dash:true},{v:a,c:'#f4b23e'},{v:cumSeries(s.flows),c:'#3ccfa0',w:2}],N+1)+`<div class="leg"><span><i style="background:#f4b23e"></i>${S('السيولة الفعلية','Actual cash')}</span><span><i style="background:#9db9cf"></i>${S('السيولة في الخطة','Planned cash')}</span><span><i style="background:#3ccfa0"></i>${S('التدفق التراكمي الفعلي','Actual cumulative flow')}</span></div>`}

function updLog(){
  const el=$('logp');if(!el)return;
  app.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===G.tab));
  if(G.tab==='dec')el.innerHTML=`<div class="logs">${logHTML(G.log)||`<div class="note">${S('لا قرارات بعد.','No decisions yet.')}</div>`}</div>`;
  else el.innerHTML=`<div class="tl">${G.tl.slice().reverse().map(x=>`<div><small>${S('يوم','Day')} ${n(x.d)}</small>${P2(x.t)}</div>`).join('')||`<div class="note">${S('لا أحداث بعد.','No events yet.')}</div>`}</div>`}
function logHTML(arr){
  return arr.slice().reverse().map(e=>{
    if(e.setup)return `<div class="le"><b>${P2(e.title)}: ${P2(e.chosenName)}</b>${e.opts.map(o=>`<div class="alt ${o.ch?'ch':''}"><span>${o.ch?'✔ ':''}${P2(o.t)}</span><span>NPV ${m(o.npv)}</span></div>`).join('')}<small>${S('مقارنة الخطة النظرية بدون أحداث','Plan comparison without events')}</small></div>`;
    const best=Math.max(...e.opts.filter(o=>o.npv!=null).map(o=>o.npv));
    return `<div class="le"><b>${S('يوم','Day')} ${n(e.d)} • ${P2(e.title)}</b>${e.opts.map((o,i)=>o.npv==null?`<div class="alt"><span>${P2(o.t)}</span><span>${S('غير متاح','n/a')}</span></div>`:`<div class="alt ${i===e.chosen?'ch':''}"><span>${i===e.chosen?'✔ ':''}${P2(o.t)} <small>${P2(o.h)}</small></span><span>${n((o.npv-e.opts[e.chosen].npv>=0?'+':'')+'')}${m(o.npv-e.opts[e.chosen].npv)}</span></div>`).join('')}
     <small>${S('الأثر على NPV المتوقع (مقارنة بالقرار المختار) وقت القرار.','Projected NPV vs chosen option at decision time.')}</small>
     <small>${S('أثر الحدث وردّك عليه:','Event + your response:')} ${m(e.impact)}</small>
     ${e.review?`<small>${S('بعد 90 يومًا: السيولة','After 90 days: cash')} ${m(e.review.cash)}, NPV ${m(e.review.npv)}</small>`:`<small>${S('تظهر نتائج الـ 90 يومًا لاحقًا','90-day review pending')}</small>`}</div>`}).join('')}

/* ---------- events ---------- */
function openEvent(){
  const s=G.s;G.preNPV=kProj(s).npv;
  const ev=startEvent(s);G.modalEv=ev;showModal();
  updScene(s,G.run);if($('ctl'))buildCtl();updateGame(false)}
function showModal(){
  const ev=G.modalEv,s=G.s,box=$('modal');
  box.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><span class="tag t-${ev.kind}">${ev.tag(s)}</span><h2>${ev.title(s)}</h2><p>${ev.body(s)}</p>${ev.facts?ev.facts(s):''}
   <p class="note">${S('احتمال ظهور هذا الحدث في سيناريوك','Chance of this event in your scenario')}: ${n(Math.round((s.evs[ev.id]?s.evs[ev.id].p:1)*100)+'%')} • ${S('اليوم','Day')} ${n(s.d)}</p>
   ${ev.opts.map((o,i)=>{const why=o.avail?o.avail(s):null;return `<button class="opt" data-k="${i}" ${why?'disabled':''}><b>${o.t(s)}</b><span>${why||o.h(s)}</span></button>`}).join('')}</div>`;
  box.classList.add('show');box.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>chooseOpt(+b.dataset.k)))}
function chooseOpt(k){
  const ev=G.modalEv,s=G.s;
  const evals=ev.opts.map((o,i)=>optAvail(s,ev,i)?null:evalOpt(s,ev,i));
  const entry={d:s.d,id:ev.id,kind:ev.kind,title:both(()=>ev.title(s)),chosen:k,cash0:s.cash-s.od,pre:G.preNPV,review:null,
    opts:ev.opts.map((o,i)=>({t:both(()=>o.t(s)),h:both(()=>o.h(s)),npv:evals[i]}))};
  ev.opts[k].fx(s);s.pendingEvent=null;s.cur=null;
  entry.post=evals[k];entry.impact=evals[k]-G.preNPV;
  G.log.push(entry);G.tl.push({d:s.d,t:both(()=>S('قرار: ','Decision: ')+ev.title(s)+' → '+ev.opts[k].t(s))});
  G.modalEv=null;$('modal').classList.remove('show');refreshK();G.lastM=s.hist.length;
  if($('ctl'))buildCtl();updateGame(true);G.tab='dec';updLog();
  if(G.resume){G.resume=false;play()}
}

/* ---------- results ---------- */
function finishGame(){
  const s=G.s,run=G.run;
  const act=kpiOf(s.dead?s:projOf(s)),altS=bestRun(run,G.seed),alt=kpiOf(altS.dead?altS:projOf(altS)),plan=G.planK;
  const planF=G.plan,actF=s.dead?s:projOf(s),altF=altS.dead?altS:projOf(altS);
  R={act:act,alt:alt,plan:plan,planF:planF,actF:actF,altF:altF};
  view='results';render()}
function renderResults(){
  const s=G.s,{act,alt,plan,planF,actF,altF}=R;
  let verdict,sub;
  if(s.dead){verdict=S('المشروع تعثّر','The project defaulted');sub=S('المكشوف تجاوز الحد قبل أن يعوّض المشروع تكاليفه. هذا ما تكشفه المحاكاة قبل أن تدفع فلوسك الحقيقية.','Overdraft passed the limit before the project could pay for itself. This is what simulation reveals before real money is spent.')}
  else if(act.npv>=plan.npv*0.8){verdict=S('نجا المشروع وحافظ على جدواه','The project held its feasibility');sub=S('قراراتك امتصت المخاطر وبقيت المؤشرات قريبة من الدراسة.','Your decisions absorbed the risks and indicators stayed close to the study.')}
  else if(act.npv>0){verdict=S('مجدٍ لكن أقل من الدراسة','Viable but below the study');sub=S('المخاطر أكلت جزءًا من العائد، ومع ذلك ما زالت القيمة الحالية موجبة.','Risks ate part of the return, yet present value stays positive.')}
  else{verdict=S('المخاطر حوّلت المشروع إلى خسارة','Risks turned the project into a loss');sub=S('الدراسة وحدها كانت ستعطيك صورة أجمل من الواقع.','The study alone would have painted a rosier picture.')}
  const dm=v=>v==null?'—':n(Math.round(v/30*10)/10)+' '+S('شهر','mo');
  const rowsD=[
   [S('التكلفة الإجمالية للتأسيس','Total setup cost'),m(plan.invest),m(act.invest),m(alt.invest)],
   [S('موعد بدء الإنتاج التجاري','Commercial production start'),dm(plan.prodDay),dm(act.prodDay),dm(alt.prodDay)],
   [S('مدة التنفيذ حتى التشغيل','Time to operate'),dm(plan.prodDay),dm(act.prodDay),dm(alt.prodDay)],
   [S('إيرادات 7 سنوات','Revenue (7 yrs)'),m(plan.rev),m(act.rev),m(alt.rev)],
   [S('صافي الربح 7 سنوات','Net profit (7 yrs)'),m(plan.profit),m(act.profit),m(alt.profit)],
   [S('التدفق النقدي التراكمي','Cumulative cash flow'),m(plan.cum),m(act.cum),m(alt.cum)],
   ['NPV',m(plan.npv),m(act.npv),m(alt.npv)],['IRR',pcs(plan.irr),pcs(act.irr),pcs(alt.irr)],
   [S('فترة الاسترداد','Payback'),yrs(plan.pb),yrs(act.pb),yrs(alt.pb)],
   [S('احتياج تمويل إضافي','Extra funding needed'),m(plan.extra),m(act.extra),m(alt.extra)],
   [S('أقل سيولة','Lowest liquidity'),m(plan.minLiq),m(act.minLiq),m(alt.minLiq)]];
  const evs=G.log.filter(e=>!e.setup);
  const byImpact=evs.slice().sort((a,b)=>Math.abs(b.impact)-Math.abs(a.impact)).slice(0,3);
  const byRegret=evs.map(e=>({e:e,r:Math.max(...e.opts.filter(o=>o.npv!=null).map(o=>o.npv))-e.opts[e.chosen].npv})).filter(x=>x.r>1000).sort((a,b)=>b.r-a.r).slice(0,2);
  const delay=(act.prodDay!=null&&plan.prodDay!=null)?act.prodDay-plan.prodDay:null,bud=plan.invest?(act.invest-plan.invest)/plan.invest:0;
  const why=[];
  if(delay!=null)why.push(S(`بدأ الإنتاج بعد ${n(Math.abs(delay))} يومًا ${delay>=0?'من':'قبل'} الموعد المخطط.`,`Production started ${n(Math.abs(delay))} days ${delay>=0?'after':'before'} plan.`));
  why.push(S(`تكلفة التأسيس ${bud>=0?'زادت':'انخفضت'} ${n(Math.abs(bud*100).toFixed(1)+'%')} عن الخطة.`,`Setup cost ${bud>=0?'rose':'fell'} ${n(Math.abs(bud*100).toFixed(1)+'%')} vs plan.`));
  byImpact.forEach(e=>why.push(S(`${P2(e.title)} (يوم ${n(e.d)}): أثره مع ردّك على NPV المتوقع ${m(e.impact)}.`,`${P2(e.title)} (day ${n(e.d)}): event plus your response moved projected NPV by ${m(e.impact)}.`)));
  byRegret.forEach(x=>why.push(S(`في «${P2(x.e.title)}» كان هناك بديل أفضل بنحو ${m(x.r)} من NPV.`,`On “${P2(x.e.title)}” a better option was worth about ${m(x.r)} of NPV.`)));
  const cs=cumSeries(planF.flows),ca=cumSeries(actF.flows),cb=cumSeries(altF.flows);
  const stTab=G.strat.map(r=>`<div class="l">${P2(G.run.lines[r.l].name)} + ${P2(G.run.sites[r.s].name)}${r.chosen?' ✔':''}</div><div class="v">${m(r.k.npv)}</div><div class="v">${pcs(r.k.irr)}</div><div class="v">${yrs(r.k.pb)}</div>`).join('');
  app.innerHTML=`<span class="tag ${act.npv>0&&!s.dead?'t-pos':'t-neg'}">${S('النتيجة النهائية','Final result')}</span><div class="verdict">${verdict}</div><p class="lead" style="margin:0 0 12px">${sub}</p>
  <div class="card scene">${sceneSVG()}</div>
  <div class="cmp"><div class="h"></div><div class="h">${S('الخطة','Plan')}</div><div class="h a">${S('ما حدث','Actual')}</div><div class="h">${S('قرارات أفضل','Better calls')}</div>${rowsD.map(r=>`<div class="l">${r[0]}</div><div class="v">${r[1]}</div><div class="v a">${r[2]}</div><div class="v">${r[3]}</div>`).join('')}</div>
  <p class="note">${S('«قرارات أفضل» هو أفضل اختيار لكل حدث لنفس السيناريو، محسوب بأثر رجعي. بعد شهر 36 تُستكمل الأرقام حتى 7 سنوات بظروف التشغيل التي وصلت لها.','“Better calls” picks the best option on each event of the same scenario, with hindsight. After month 36, figures are extended to 7 years under the conditions you reached.')}</p>
  <div class="gcols"><div class="stack"><div class="card"><h3>${S('التدفق النقدي التراكمي (7 سنوات)','Cumulative cash flow (7 years)')}</h3>${lineChart([{v:cs,c:'#9db9cf',dash:true},{v:ca,c:'#f4b23e'},{v:cb,c:'#3ccfa0',w:2}],cs.length)}
    <div class="leg"><span><i style="background:#9db9cf"></i>${S('الخطة','Plan')}</span><span><i style="background:#f4b23e"></i>${S('ما حدث','Actual')}</span><span><i style="background:#3ccfa0"></i>${S('قرارات أفضل','Better calls')}</span></div></div>
   <div class="card"><h3>${S('لو اخترت استراتيجية أخرى (بدون أحداث)','If you had chosen another strategy (no events)')}</h3><div class="cmp" style="grid-template-columns:2fr 1fr 1fr 1fr;margin:0"><div class="h">${S('الاستراتيجية','Strategy')}</div><div class="h">NPV</div><div class="h">IRR</div><div class="h">${S('الاسترداد','Payback')}</div>${stTab}</div></div></div>
   <div class="stack"><div class="card"><h3>${S('لماذا اختلفت النتيجة عن الخطة؟','Why did the result differ?')}</h3><div class="why">${why.map(w=>`<div>${w}</div>`).join('')}</div></div>
   <div class="card"><h3>${S('سجل القرارات','Decision log')}</h3><div class="logs">${logHTML(G.log)}</div></div></div></div>
  <div class="btns"><button class="cta" id="rSame">${S('أعد نفس الأحداث','Replay same events')}</button><button class="cta sec" id="rNew">${S('سيناريو جديد','New scenario')}</button><button class="cta sec" id="rCfg">${S('غيّر الاستراتيجية','Change strategy')}</button>
   <a class="cta sec" href="https://payhip.com/Gadwaty" target="_blank" rel="noopener">${S('اطلب دراسة جدوى لمشروعك الحقيقي','Order a real feasibility study')}</a></div>
  <p class="disc">${S('المحاكاة تستخدم أرقامًا افتراضية وأحداثًا عشوائية مقيدة بقواعد المشروع. لا تعتمد عليها وحدها في قرار استثماري حقيقي.','The simulation uses assumed numbers and random events bound by project rules. Do not rely on it alone for a real investment decision.')}</p>`;
  updScene(s,G.run);
  $('rSame').addEventListener('click',()=>startGame(G.seed));$('rNew').addEventListener('click',()=>startGame(Math.floor(Math.random()*4294967296)));$('rCfg').addEventListener('click',()=>{view='setup';render()});
}
render();
</script>
