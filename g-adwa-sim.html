<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G-Adwa | مختبر الاستثمار</title>
<meta name="description" content="G-Adwa: محاكي استثمار تفاعلي. اختبر مشروعك (مصنع، مطعم، مغسلة، عيادة، مخبز، شركة تسويق أو سياحة) قبل أن تدفع فلوسك الحقيقية.">
<meta property="og:title" content="G-Adwa | مختبر الاستثمار"><meta property="og:description" content="ابنِ مشروعك وشغّله وسط المخاطر قبل أن تدفع فلوسك الحقيقية."><meta property="og:type" content="website"><meta property="og:url" content="https://www.g-adwa.com"><meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#235f8c;--bg2:#265f8b;--panel:#2f73a3;--line:#5d9bc6;--line2:#98c8e8;--ink:#f6fafd;--dim:#e2eff9;--amber:#f4b23e;--mint:#3ccfa0;--coral:#ff9a8f;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',Tahoma,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;min-height:100vh;
 background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:32px 32px;
 padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1160px;margin:0 auto;padding:14px 14px 60px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.brand{font-weight:800;font-size:1.15rem}.brand small{font-weight:400;color:var(--dim);margin-inline-start:8px;font-size:.85rem}
.tb{display:flex;gap:8px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 14px;color:var(--dim);font-size:.9rem}
.ghost:hover{border-color:var(--line2);color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:1rem;margin-bottom:8px}
h1{font-size:clamp(1.7rem,5vw,2.8rem);line-height:1.25;font-weight:800;max-width:20ch}
.lead{color:var(--dim);max-width:62ch;margin:10px 0 18px}
.cta{display:inline-block;background:var(--amber);color:#1b2a38;border:0;border-radius:12px;padding:11px 26px;font-weight:800;font-size:1.05rem;text-decoration:none}
.cta:hover{filter:brightness(1.07)}.cta.sec{background:none;color:var(--ink);border:1px solid var(--line2);font-weight:600}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.note{color:var(--dim);font-size:.82rem}
.tag{display:inline-block;border-radius:999px;padding:1px 12px;font-size:.8rem;font-weight:600;margin-bottom:6px}
.t-neg{background:rgba(255,107,94,.16);color:var(--coral)}.t-pos{background:rgba(60,207,160,.16);color:var(--mint)}.t-neu{background:rgba(244,178,62,.16);color:var(--amber)}
.pos{color:var(--mint)}.neg{color:var(--coral)}

/* setup */
.setup{display:grid;grid-template-columns:1fr 350px;gap:14px;align-items:start}
@media(max-width:900px){.setup,.gcols{grid-template-columns:1fr!important}}
.steps{display:grid;gap:14px}
.ocs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.oc{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:start}
.oc b{display:block}.oc small{color:var(--dim);display:block;font-size:.8rem;line-height:1.5}
.oc.on{border-color:var(--amber);background:rgba(244,178,62,.08)}.oc.on b{color:var(--amber)}
.oc.off{opacity:.45;cursor:not-allowed}
.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.ed label{font-size:.78rem;color:var(--dim);display:block}
.ed input,.num{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--ink);font:inherit}
.unc{color:var(--amber);font-size:.7rem;margin-inline-start:4px}
.sl{margin:10px 0}.sl label{display:flex;justify-content:space-between;font-weight:600;font-size:.92rem}.sl label span{color:var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber);height:26px}
.seg{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 6px;font-size:.88rem}
.seg button.on{border-color:var(--amber);color:var(--amber);background:rgba(244,178,62,.1)}
.sub{font-size:.88rem;color:var(--dim);font-weight:600;margin-top:12px}
.sum{position:sticky;top:10px}
.rows{width:100%;border-collapse:collapse;margin:6px 0}.rows td{padding:4px 0;border-bottom:1px solid var(--line);font-size:.9rem}.rows td:last-child{text-align:end}
.rows tr.tot td{font-weight:800;border-bottom:0}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.kp div{background:var(--bg2);border-radius:10px;padding:7px 10px}
.kp small{display:block;color:var(--dim);font-size:.76rem}.kp b{font-size:1.1rem;font-weight:800}
.warn{background:rgba(244,178,62,.1);border:1px solid var(--amber);border-radius:10px;padding:6px 10px;font-size:.84rem;margin:8px 0}

/* game */
.hdr{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.clock{font-weight:800;font-size:1.15rem}.stg{color:var(--amber);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.88rem}
.chip.bad{border-color:var(--coral);color:var(--coral)}
.scene{padding:0;overflow:hidden;position:relative}
.scene svg{display:block;width:100%;height:auto}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.ctl button{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 14px;font-size:.92rem}
.ctl button:hover:not(:disabled){border-color:var(--amber)}.ctl button:disabled{opacity:.4;cursor:not-allowed}
.ctl .play{background:var(--amber);color:#1b2a38;font-weight:800;border-color:var(--amber)}
.ctl .on{border-color:var(--amber);color:var(--amber)}
.sep{flex:1}
.gcols{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px;align-items:start}
.stack{display:grid;gap:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--bg2);border-radius:10px;padding:7px 10px}.tile small{display:block;color:var(--dim);font-size:.75rem}.tile b{font-size:1.02rem}
.fa{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.fa button{background:none;border:1px dashed var(--line2);border-radius:9px;padding:2px 10px;font-size:.82rem}.fa button:disabled{opacity:.35;cursor:not-allowed}
.gantt{display:grid;grid-template-columns:96px 1fr;gap:5px 8px;align-items:center;font-size:.8rem}
.gantt .tr{position:relative;height:18px;background:rgba(0,0,0,.18);border-radius:4px;direction:ltr}
.gantt .b{position:absolute;top:0;height:100%;border-radius:4px}
.b.pl{border:1.5px solid var(--dim);background:none;height:56%;top:22%}
.b.ac{background:var(--mint)}.b.ac.late{background:var(--coral)}
.b.fc{background:repeating-linear-gradient(45deg,rgba(244,178,62,.55) 0 4px,rgba(244,178,62,.2) 4px 8px)}
.gantt .td{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.8}
.gantt .lb{display:flex;justify-content:space-between;gap:4px}.dl{font-size:.7rem}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--dim);margin-top:6px}.leg i{display:inline-block;width:16px;height:3px;margin-inline-end:4px;vertical-align:middle;border-radius:2px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{background:none;border:1px solid var(--line);border-radius:999px;padding:1px 14px;font-size:.85rem}.tabs button.on{border-color:var(--amber);color:var(--amber)}
.logs{max-height:420px;overflow:auto;display:grid;gap:8px}
.le{background:var(--bg2);border-radius:10px;padding:8px 10px;font-size:.86rem}.le b{display:block}.le small{color:var(--dim);display:block}
.le .alt{display:flex;justify-content:space-between;gap:8px;font-size:.8rem}.le .alt.ch{color:var(--amber);font-weight:600}
.tl{display:grid;gap:4px;max-height:420px;overflow:auto;font-size:.84rem}.tl div{border-bottom:1px solid var(--line);padding:3px 0}.tl small{color:var(--dim);margin-inline-end:6px}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,20,34,.72);backdrop-filter:blur(3px);z-index:20;padding:14px}
#modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.mbox h2{font-size:1.3rem;line-height:1.4;margin-bottom:4px}.mbox p{color:var(--dim);margin-bottom:10px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.facts div{background:var(--bg2);border-radius:10px;padding:6px 10px;font-size:.8rem;color:var(--dim)}.facts b{display:block;color:var(--ink);font-size:.98rem}
.opt{display:block;width:100%;text-align:start;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-top:8px}
.opt:hover:not(:disabled){border-color:var(--amber)}.opt:disabled{opacity:.45;cursor:not-allowed}.opt b{display:block}.opt span{color:var(--dim);font-size:.86rem}
#toasts{position:fixed;inset-inline-start:12px;bottom:12px;display:grid;gap:6px;z-index:15;max-width:320px}
.ts{background:var(--bg2);border:1px solid var(--amber);border-radius:10px;padding:6px 12px;font-size:.86rem;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* results */
.verdict{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:800;line-height:1.3;margin:4px 0}
.cmp{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0}
.cmp>div{padding:7px 9px;border-bottom:1px solid var(--line);font-size:.88rem}.cmp .h{background:var(--bg2);font-weight:800;text-align:center}.cmp .l{color:var(--dim)}.cmp .v{text-align:center}.cmp .a{background:rgba(244,178,62,.07)}
.why{display:grid;gap:8px;margin-top:8px}.why div{background:var(--bg2);border-radius:10px;padding:8px 12px;font-size:.9rem}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.disc{color:var(--dim);font-size:.78rem;margin-top:18px;max-width:80ch}
/* scene */
.g{opacity:0;transition:opacity .6s;pointer-events:none}.g.on{opacity:1}
@keyframes belt{from{transform:translateX(0)}to{transform:translateX(300px)}}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:.6}100%{transform:translateY(-40px) scale(1.7);opacity:0}}
@keyframes pace{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes drive{from{transform:translateX(-120px)}to{transform:translateX(1060px)}}
@keyframes cloud{from{transform:translateX(-200px)}to{transform:translateX(1160px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-24px)}}
@keyframes flag{0%,100%{transform:skewY(-6deg)}50%{transform:skewY(6deg)}}
.bx{animation:belt var(--bs,3s) linear infinite}.sm{animation:smoke 3s ease-out infinite}
.pace{animation:pace 3s ease-in-out infinite alternate}.drive{animation:drive 16s linear infinite}
.cloud{animation:cloud 90s linear infinite}.blink{animation:blink .9s infinite}.hook{animation:swing 3s ease-in-out infinite;transform-origin:520px 112px}
.wv{animation:wave 3s linear infinite}.flg{animation:flag 1.6s ease-in-out infinite;transform-origin:left center;transform-box:fill-box}
@media(prefers-reduced-motion:reduce){.bx,.sm,.pace,.drive,.cloud,.blink,.hook,.wv,.flg{animation:none}}

.printhead{display:none}
.dots{display:inline-flex;gap:4px;margin-inline-start:10px;vertical-align:middle}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28)}.dots i.on{background:var(--amber)}
.badges{display:flex;gap:8px;flex-wrap:wrap}.bdg{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:.84rem;opacity:.45;max-width:230px}.bdg b{display:block}.bdg small{color:var(--dim);display:block;font-size:.74rem;line-height:1.4}.bdg.on{opacity:1;border-color:var(--amber)}.bdg.new{animation:pop .7s}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.mbox{animation:pop .3s}
@media print{
 body{background:#fff!important;color:#111!important}
 .wrap{max-width:none;padding:0}
 .top,.btns,#toasts,#modal,.ctl,#confetti{display:none!important}
 .printhead{display:block!important;border-bottom:2px solid #1f4e79;margin-bottom:10px;padding-bottom:6px;color:#111}
 .card,.cmp,.le,.why div,.kp div,.bdg{background:#fff!important;color:#111!important;border-color:#bbb!important}
 .cmp .h{background:#eef3f7!important;color:#111!important}.cmp .a{background:#fff6e0!important}
 .cmp .l,.note,.disc,.lead,.le small,.bdg small{color:#444!important}.pos{color:#0a7a55!important}.neg{color:#b3261e!important}
 .tag{border:1px solid #999;color:#111!important;background:#fff!important}.verdict{color:#111}
 .logs{max-height:none!important;overflow:visible!important}.card,.cmp{break-inside:avoid}.scene svg{max-width:100%}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact;animation:none!important}
}
.exb{display:block;width:100%;text-align:start;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;margin-top:6px}.exb:hover:not(:disabled){border-color:var(--amber)}.exb:disabled{opacity:.55;cursor:not-allowed}.exb.done{border-color:var(--mint)}.exb b{display:block}.exb span{color:var(--dim);font-size:.78rem}
.goal{padding:4px 0;border-bottom:1px solid var(--line);font-size:.9rem}.goal.ok span{color:var(--mint)}.goal.fail span{color:var(--coral)}.goal small{color:var(--dim)}
.tile small{display:inline!important;font-size:.7rem!important}
.disc.store{font-size:.9rem;margin-top:6px}.disc.store a{color:var(--amber);font-weight:800;text-decoration:underline}
.grp{font-weight:800;font-size:.95rem;margin:10px 0 6px;color:var(--dim)}
.oc.pj{position:relative;border-inline-start:6px solid var(--pc);background:linear-gradient(135deg,var(--pt),rgba(0,0,0,.12) 70%);padding-inline-start:14px}
.oc.pj i{font-style:normal;font-size:1.3rem;display:block;margin-bottom:2px}
.oc.pj.on{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc),0 6px 18px rgba(0,0,0,.25);background:linear-gradient(135deg,var(--pt),var(--pt))}
.oc.pj.on b{color:#fff}
.seg.bk button{padding:10px 8px;font-weight:600}.seg.bk button small{display:block;color:var(--dim);font-weight:400}
.seg.bk button[data-v="yes"].on{border-color:var(--mint);color:var(--mint);background:rgba(60,207,160,.14)}
.seg.bk button[data-v="no"].on{border-color:var(--coral);color:var(--coral);background:rgba(255,154,143,.14)}
@media print{.exb,.goal{color:#111}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="brand">G-Adwa<small id="sub"></small></div>
  <div class="tb"><button class="ghost" id="soundBtn" aria-label="sound">🔇</button><button class="ghost" id="helpBtn"></button><button class="ghost" id="homeBtn" hidden></button><button class="ghost" id="langBtn"></button></div></div>
 <div id="app"></div>
</div>
<div id="modal"></div><div id="toasts"></div>

<script>
/*ENGINE*/
let LANG='ar';
const S=(ar,en)=>LANG==='ar'?ar:en;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const clone=o=>JSON.parse(JSON.stringify(o));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MARKETS={sa:{cur:'SAR',ar:'ر.س',tax:0.20,disc:0.10}};
let CUR=MARKETS.sa;
const n=x=>'<span class="n">'+x+'</span>';
function m(v){if(v==null||isNaN(v))return '—';const a=Math.abs(v),sg=v<0?'−':'';
  if(LANG==='ar'){const t=a>=1e6?(a/1e6).toFixed(2):a>=1e3?String(Math.round(a/1e3)):String(Math.round(a));return n(sg+t)+(a>=1e6?' مليون':a>=1e3?' ألف':'')+' '+CUR.ar}
  const t=a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?Math.round(a/1e3)+'K':String(Math.round(a));return n(sg+CUR.cur+' '+t)}
const pcs=x=>x==null?'—':n((x*100).toFixed(1)+'%');
const yrs=x=>x==null?S('لا يُسترد خلال 7 سنوات','Not within 7 yrs'):n(x.toFixed(1))+' '+S('سنة','yr');
const dayTxt=d=>d==null?'—':S(`اليوم ${n(d)} (الشهر ${n(Math.ceil(d/30))})`,`Day ${n(d)} (month ${n(Math.ceil(d/30))})`);
function both(fn){const k=LANG;LANG='ar';const a=fn();LANG='en';const b=fn();LANG=k;return {ar:a,en:b}}
const P2=o=>o[LANG];

const DAYS=30,HORIZON=2520,ENDDAY=1080;
const MNT={low:{c:0.6,fail:1.5,def:0.004},std:{c:1,fail:1,def:0},high:{c:1.5,fail:0.65,def:-0.003}};
const PR=c=>PROJECTS[c.project];
const SC=s=>{const p=PROJECTS[s.cfg.project];return p.scns[s.cfg.scenario]||p.scns.base};
const K=s=>PROJECTS[s.cfg.project].k;
const T=(s,k)=>{const o=PROJECTS[s.cfg.project].t[k];return LANG==='ar'?o.ar:o.en};
const B=(ar,en)=>({ar:ar,en:en});

const PROJECTS={
/* ---------------- مصنع مستلزمات طبية ---------------- */
med:{id:'med',scene:'factory',k:1,color:'#4fb3d9',icon:'💊',
 name:B('مصنع مستلزمات طبية','Medical supplies factory'),
 sub:B('السوق السعودي • الوحدة = علبة مستلزمات طبية استهلاكية','Saudi market • unit = a box of disposable medical supplies'),
 refDemand:1000000,price:15,varCost:9,adminM:35000,utilM:12000,trialD:45,trialDef:0.22,rampDays:120,ramp0:0.4,
 stockDays:20,matShare:0.7,defBase:0.03,trialShare:0.3,trialSell:0,eqDelay:90,eqOff:[45,90],licDelay:45,trialAdd:[6,21],
 creditDays:45,payDays:30,reserve:2500000,loan:2000000,maxOD:2500000,maxDebt:6000000,finStep:500000,finOpts:[0,2000000,4000000],loanMax:5000000,resMax:4000000,step:100000,
 priceRange:[10,20,0.5],costRange:[6,12,0.5],
 interim:{label:B('استأجر خطًا مؤقتًا صغيرًا','Rent a small interim line'),ready:35,share:0.25,rentM:45000,setup:120000},
 lab:{lean:{m:65000,cap:0.94,def:0.005},std:{m:85000,cap:1,def:0},ext:{m:110000,cap:1.06,def:-0.003}},
 qc:{low:{c:6000,def:0.015,aud:1.6},std:{c:12000,def:0,aud:1},high:{c:20000,def:-0.01,aud:0.5}},
 ep:{},
 newProd:[
  {name:B('منتج جديد بقالب بسيط (حاوية أو غطاء)','New product, simple mould (container or cap)'),mould:300000,lead:60,co:12,dem:0.06,price:0.02,xf:3000},
  {name:B('منتج طبي بقالب حديد متعدد التجاويف','Medical product, multi-cavity steel mould'),mould:700000,lead:100,co:20,dem:0.14,price:0.05,xf:6000}],

  const M=s.m;M.rev+=rev;M.cogs+=cogs;M.scrap+=scrapC;M.fixed+=fd;M.preop+=f.preop;M.opex+=oneO;M.dep+=dep;M.int+=f.int;
  s.preopSpent+=f.preop;
  if(d%DAYS===0){
    const pm=M.rev-M.cogs-M.scrap-M.fixed-M.preop-M.opex-M.dep-M.int;let t=0;
    if(pm<0)s.nol+=-pm;else{const u=Math.min(s.nol,pm);s.nol-=u;t=(pm-u)*tx}
    f.tax=t;s.lastTax=t;
    if(d>=s.graceEnd&&s.debt>0){const p=Math.min(s.debt,s.tlAmt/36);f.fin-=p;s.debt-=p;if(s.debt<1)s.debt=0}
    s.pmTmp=pm;
  }
  const flow=f.coll-f.supp-f.varc-f.fixed-f.preop-f.capex-f.one-f.int-f.tax;
  s.cash+=flow+f.fin;s.mflow+=flow;
  if(s.cash<0){const x=-s.cash;s.od+=x;s.cash=0;if(s.od>s.peakOD)s.peakOD=s.od;nt('od')}
  else if(s.od>0&&s.cash>0){const p=Math.min(s.cash,s.od);s.od-=p;s.cash-=p}
  if(s.od>s.peakOD)s.peakOD=s.od;
  if(s.cash-s.od<s.minLiq)s.minLiq=s.cash-s.od;
  if(s.od>cfg.maxOD&&!s.plan&&!s.dead){s.dead=true;nt('dead')}
  s.out30=s.out30*0.967+(f.supp+f.varc+f.fixed+f.int+f.one)*0.033;
  s.mode=mode;s.prodToday=prod>0;s.haltNow=e.halt===0;s.lastRev=rev;
  if(d%DAYS===0){
    if(ms.trialDone!==null){
      const q=s.prodSum>0?clamp(1-((s.drSum/s.prodSum)-0.02)/0.06,0,1):0.8,sv=s.svcDem>0?clamp(s.svcSold/s.svcDem,0,1):1;
      const tg=20+40*q+40*sv-Math.min(15,s.haltDays*2);
      s.rep=clamp(s.rep+(tg-s.rep)*0.12+s.repHit,0,100);s.repHit=0;s.repMult=1+(s.rep-70)/50*0.08;
      const runway=s.out30>0?s.cash/s.out30:60,ebm=M.rev-M.cogs-M.scrap-M.fixed-M.opex,lev=ebm>0?clamp(s.debt/(ebm*12)-2,0,3)/3:0.5;
      const ct=60+15*clamp((runway-15)/45,-1,1)-(s.od>0?15:0)-10*lev+(s.pmTmp>0?5:-5)+3*(sv-0.9)/0.1;
      s.cr=clamp(s.cr+(ct-s.cr)*0.2,0,100);s.odRate=0.12+clamp((60-s.cr)/100*0.1,-0.02,0.06);
      s.cov=s.cov.filter(c=>c.until>d);
      for(const c of s.cov){if(sv<c.min){s.oneOpex+=c.pen*M.rev;s.repHit-=4;nt('covPen')}}
    }
    s.svcDem=0;s.svcSold=0;s.drSum=0;s.prodSum=0;s.haltDays=0;
    s.hist.push({m:d/DAYS,rev:M.rev,profit:s.pmTmp-s.lastTax,flow:s.mflow,cash:s.cash,od:s.od,debt:s.debt,ar:s.ar,ap:s.ap,sv:s.stockVal,rep:s.rep,cr:s.cr});
    s.flows.push(s.mflow);s.mflow=0;s.m={rev:0,cogs:0,scrap:0,fixed:0,preop:0,opex:0,dep:0,int:0};
  }
  if(!s.noEv&&!s.pendingEvent){const ev=nextEvent(s);if(ev)s.pendingEvent=ev.id}
}

/* KPIs */
const npvOf=fl=>{const r=Math.pow(1+MARKETS.sa.disc,1/12)-1;return fl.reduce((a,x,t)=>a+x/Math.pow(1+r,t+1),0)};
function irrOf(fl){const f=r=>fl.reduce((a,x,t)=>a+x/Math.pow(1+r,t+1),0);let lo=-0.5,hi=1,flo=f(lo);if(!(flo*f(hi)<0))return null;
  for(let k=0;k<70;k++){const mid=(lo+hi)/2,fm=f(mid);if(flo*fm<=0)hi=mid;else{lo=mid;flo=fm}}return Math.pow(1+(lo+hi)/2,12)-1}
function paybackOf(fl){let c=0;for(let t=0;t<fl.length;t++){const p=c;c+=fl[t];if(c>=0&&t>0&&fl[t]>0)return(t+(-p)/fl[t])/12}return null}
function kpiOf(c){
  const fl=c.flows.slice(),fr=fl.slice();
  const resid=Math.max(0,c.capEq-c.depEqAcc)+Math.max(0,c.capSite-c.depSiteAcc)+Math.max(0,c.ar+c.stockVal-c.ap);
  if(fr.length)fr[fr.length-1]+=resid;
  const sum=(a,k)=>a.reduce((x,h)=>x+h[k],0);
  return {npv:npvOf(fr),irr:irrOf(fr),pb:paybackOf(fl),cum:fl.reduce((a,b)=>a+b,0),rev:sum(c.hist,'rev'),profit:sum(c.hist,'profit'),
   invest:c.capEq+c.capSite+c.preopSpent,peakOD:c.peakOD,extra:c.peakOD+c.equityAdded,minLiq:c.minLiq,prodDay:c.ms.trialDone,ms:c.ms,eq:c.equityAdded}}
function planOf(cfg){const s=init(cfg,true,0);s.quiet=true;while(s.d<HORIZON)tick(s);return s}
function projOf(s){const c=clone(s);c.noEv=true;c.quiet=true;c.pendingEvent=null;c.notes=[];c.plan=true;while(c.d<HORIZON)tick(c);return c}
const kProj=s=>kpiOf(s.dead?s:projOf(s));

function npDef(s){return PR(s.cfg).newProd||[]}
function npCan(s,i){const p=npDef(s)[i];return !!p&&s.ms.trialDone!==null&&s.prods.indexOf(i)<0&&!s.npDay&&!s.dead}
function launchProd(s,i){const p=npDef(s)[i];
  capexAdd(s,p.mould,'eq');
  addMod(s,'demand',1+p.dem,null,p.lead);if(p.price)addMod(s,'price',1+p.price,null,p.lead);
  addMod(s,'halt',0,p.co,p.lead);
  addMod(s,'cap',s.prods.length?0.97:0.98,null,p.lead);
  addMod(s,'xfix',p.xf,null,0);
  s.prods.push(i);s.npDay=s.d+p.lead+p.co}
function evalProd(s,i){const c=clone(s);c.quiet=true;c.noEv=true;c.pendingEvent=null;c.notes=[];launchProd(c,i);c.plan=true;while(c.d<HORIZON)tick(c);return kpiOf(c).npv}
function rnd(s,salt){let x=((s.seedv||1)^Math.imul(s.d+1,2654435761)^Math.imul(salt+1,97531))|0;x=Math.imul(x^x>>>15,2246822507);x=Math.imul(x^x>>>13,3266489909);x^=x>>>16;return(x>>>0)/4294967296}
function ratingOf(sc){return sc>=90?'AAA':sc>=80?'AA':sc>=70?'A':sc>=60?'BBB':sc>=50?'BB':sc>=40?'B':'CCC'}
function expDef(s){const pr=PR(s.cfg),L=s.cfg.line,ST=s.cfg.site,lab=pr.lab[s.cfg.labor],base=L.price+L.ship+L.inst+ST.civil;
  return [0,1,2].map(i=>({lv:i+1,cost:Math.round(base*[0.07,0.18,0.40][i]/1000)*1000,cap:[1.12,1.25,1.45][i],dem:[1.06,1.13,1.22][i],xf:Math.round(lab.m*[0.12,0.28,0.55][i]/500)*500,delay:[20,50,100][i]}))}
function expCan(s){return s.ms.trialDone!==null&&s.exp<3&&!s.expDay&&!s.dead}
function expandFx(s,lv){const D=expDef(s),d=D[lv-1],p=lv>1?D[lv-2]:{cap:1,dem:1,xf:0};
  capexAdd(s,d.cost*0.6,'eq');capexAdd(s,d.cost*0.4,'site');
  addMod(s,'cap',d.cap/p.cap,null,d.delay);addMod(s,'demand',d.dem/p.dem,null,d.delay);addMod(s,'xfix',d.xf-p.xf,null,0);
  s.exp=lv;s.expDay=s.d+d.delay}
function evalExp(s,lv){const c=clone(s);c.quiet=true;c.noEv=true;c.pendingEvent=null;c.notes=[];expandFx(c,lv);c.plan=true;while(c.d<HORIZON)tick(c);return kpiOf(c).npv}

    if(st.due===null){const a=anchorDay(s,e.anchor);if(a===null)continue;const off=typeof e.off==='function'?e.off(s):e.off;st.due=a+Math.round(off[0]+st.r2*(off[1]-off[0]))}
    if(s.d>=st.due){if(e.cond(s))return e;if(s.d>st.due+40)st.done=true}
  }
  return null}
function startEvent(s){const e=EVENTS.find(x=>x.id===s.pendingEvent);s.evs[e.id].done=true;if(e.state)s.nextLiq=s.d+150;s.cur={id:e.id,d:s.d};if(e.base)e.base(s);return e}
function evalOpt(s,e,k){const c=clone(s);c.quiet=true;c.noEv=true;c.pendingEvent=null;c.notes=[];e.opts[k].fx(c);c.plan=true;while(c.d<HORIZON)tick(c);return kpiOf(c).npv}
function optAvail(s,e,i){const o=e.opts[i];return o.avail?o.avail(s):null}
function bestRun(cfg,seed){
  const s=init(cfg,false,seed);s.quiet=true;
  while(s.d<ENDDAY&&!s.dead){tick(s);
    if(s.pendingEvent){const e=startEvent(s);let bi=-1,bv=-1e18;
      e.opts.forEach((o,i)=>{if(optAvail(s,e,i))return;const v=evalOpt(s,e,i);if(v>bv){bv=v;bi=i}});
      if(bi>=0)e.opts[bi].fx(s);s.pendingEvent=null;s.cur=null}}
  return s}
/*END*/
</script>

  G={run:run,seed:seed,s:init(run,false,seed),plan:plan,planK:kpiOf(plan),log:[],tl:[],running:false,speed:3,tab:'dec',timer:null,proj:null,k:null,lastM:-1,shipP:0,modalEv:null,resume:false,strat:stratTable(run),daily:!!(opt&&opt.daily),goals:makeGoals(plan,seed),goalsHTML:null,expHTML:null};
  G.s.quiet=false;
  G.log.push(...setupDecisions());
  refreshK();view='game';render();track('game_start',{project:run.project,scenario:run.scenario,random:!!run.hiddenScn,daily:!!G.daily,backup:run.backup||'na',lang:LANG});

   [S('رفع الإنتاج','Ramp-up'),pl.trialDone,pl.comm,ms.trialDone,ms.comm,pj.trialDone,pj.comm,ms.trialDone!==null]];
  const axis=Math.max(pl.comm||0,pj.comm||0,s.d)+30;const pc=v=>(v/axis*100).toFixed(2)+'%';

    if(as!=null){const end=ae!=null?ae:s.d;bars+=`<div class="b ac ${dl>3?'late':''}" style="left:${pc(as)};width:${pc(Math.max(1,end-as))}"></div>`}

function lineChart(series,len){
  const all=series.flatMap(x=>x.v),mx=Math.max(...all,1)*1.08,mn=Math.min(...all,0),W=600,H=170,p=8;
  const X=i=>p+(W-2*p)*i/Math.max(1,len-1),Y=v=>H-p-(H-2*p)*(v-mn)/((mx-mn)||1);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;direction:ltr"><line x1="${p}" x2="${W-p}" y1="${Y(0)}" y2="${Y(0)}" stroke="#4f86b0"/>${series.map(x=>`<polyline fill="none" stroke="${x.c}" stroke-width="${x.w||2.5}" ${x.dash?'stroke-dasharray="7 5"':''} stroke-linejoin="round" points="${x.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`).join('')}</svg>`}
function cumSeries(fl){let c=0;return [0].concat(fl.map(x=>c+=x))}

  else{
    const D=expDef(s),nm=expNames(pr);
    h=`<div class="note" style="margin-bottom:4px">${S('المستوى الحالي','Current level')}: ${n(s.exp+'/3')}${s.expDay?' • '+S('قيد التنفيذ حتى اليوم','under way until day')+' '+n(s.expDay):''}</div>`+D.map((d,i)=>{
      const pv=i?D[i-1]:{cap:1,dem:1,xf:0},done=i+1<=s.exp,lock=i!==s.exp||!expCan(s)||!!G.modalEv;
      return `<button class="exb ${done?'done':''}" data-lv="${i+1}" ${(lock||done)?'disabled':''}><b>${done?'✔ ':''}${P2(nm[i])}</b><span>${S('تكلفة','Cost')} ${m(d.cost)} • ${S('طاقة','Capacity')} +${n(Math.round((d.cap/pv.cap-1)*100)+'%')} • ${S('طلب','Demand')} +${n(Math.round((d.dem/pv.dem-1)*100)+'%')} • ${S('ثابتة','Fixed')} +${m(d.xf-pv.xf)}/${S('شهر','mo')} • ${n(d.delay)} ${S('يوم','days')}</span></button>`}).join('')}
  if(G.expHTML!==h){G.expHTML=h;ex.innerHTML=h;ex.querySelectorAll('.exb').forEach(b=>b.addEventListener('click',()=>doExpand(+b.dataset.lv)))}
}

function npHTML(s){
  const L=npDef(s);if(!L.length)return '';
  const head=`<h3 style="margin:12px 0 6px">${S('منتج جديد (يحتاج قالب حديد)','New product (needs a steel mould)')}</h3>`;
  if(s.ms.trialDone===null)return head+`<p class="note">${S('تُفتح بعد بدء التشغيل التجاري.','Unlocks once commercial operation begins.')}</p>`;
  return head+`<p class="note" style="margin-bottom:4px">${S('صناعة القالب تأخذ وقتًا طويلًا، وعند تركيبه يتوقف الخط أيام لتغيير القالب. وكثرة تغيير القوالب تخفض الطاقة قليلًا بشكل دائم.','Making a mould takes long, and fitting it stops the line for days. Frequent mould changes cut capacity slightly for good.')}</p>`+L.map((p,i)=>{
    const done=s.prods.indexOf(i)>=0,lock=!npCan(s,i)||!!G.modalEv;
    return `<button class="exb ${done?'done':''}" data-np="${i}" ${(lock||done)?'disabled':''}><b>${done?'✔ ':''}${P2(p.name)}</b><span>${S('القالب','Mould')} ${m(p.mould)} • ${S('تصنيعه','Lead')} ${n(p.lead)} ${S('يوم','days')} • ${S('توقف التغيير','Changeover stop')} ${n(p.co)} ${S('يوم','days')} • ${S('طلب','Demand')} +${n(Math.round(p.dem*100)+'%')}${p.price?' • '+S('سعر','Price')+' +'+n(Math.round(p.price*100)+'%'):''}</span></button>`}).join('')+(s.npDay?`<p class="note">${S('قيد التنفيذ حتى اليوم','Under way until day')} ${n(s.npDay)}</p>`:'');
}
function updNP(){
  const s=G.s,el=$('newprod');if(!el)return;
  const h=npHTML(s);
  if(G.npHTML!==h){G.npHTML=h;el.innerHTML=h;el.querySelectorAll('[data-np]').forEach(b=>b.addEventListener('click',()=>doProd(+b.dataset.np)))}
}
function doProd(i){
  const s=G.s;if(!npCan(s,i)||G.modalEv)return;
  const wasRun=G.running;if(wasRun)pause();
  const p=npDef(s)[i],before=kProj(s).npv,after=evalProd(s,i);
  G.log.push({d:s.d,id:'np'+i,kind:'pos',title:both(()=>S('منتج جديد: ','New product: ')+P2(p.name)),chosen:0,cash0:s.cash-s.od,pre:before,review:null,post:after,impact:after-before,
    opts:[{t:both(()=>S('اصنع القالب وأطلق المنتج','Build the mould and launch')),h:both(()=>S('القالب ','Mould ')+m(p.mould)+S(' • توقف التغيير ',' • changeover stop ')+p.co+S(' يوم',' days')),npv:after},{t:both(()=>S('لا تطلق المنتج','Do not launch')),h:both(()=>''),npv:before}]});
  track('new_product',{project:G.run.project,product:i});launchProd(s,i);G.tl.push({d:s.d,t:both(()=>S('بدأ تصنيع القالب: ','Mould in production: ')+P2(p.name))});
  G.npHTML=null;refreshK();updateGame(true);if(wasRun)play();
}
const bkNote=s=>FACP.indexOf(s.cfg.project)<0?'':`<p class="note" style="margin-bottom:8px">${s.cfg.backup==='yes'?S('✔ لديك ماكينة احتياطية: التوقف أقصر بنحو 70%.','✔ You have a backup machine: downtime is about 70% shorter.'):S('✖ لا توجد ماكينة احتياطية: التوقف أطول بأكثر من الضعف (انتظار قطع غيار).','✖ No backup machine: downtime is more than twice as long (waiting for parts).')}</p>`;
ACH.push(
 {id:'prepared',e:'🛡️',n:B('جاهز للطوارئ','Ready for emergencies'),d:B('اشتريت ماكينة احتياطية وأنهيت دون تعثر','Bought a spare machine and finished solvent'),test:(s,run)=>!s.dead&&FACP.indexOf(run.project)>=0&&run.backup==='yes'},
 {id:'innovator',e:'🧪',n:B('مبتكر','Innovator'),d:B('أطلقت منتجين جديدين بقوالب','Launched two new moulded products'),test:s=>s.prods.length>=2});
function doExpand(lv){
  const s=G.s;if(!expCan(s)||G.modalEv)return;
  const wasRun=G.running;if(wasRun)pause();
  const D=expDef(s)[lv-1],before=kProj(s).npv,after=evalExp(s,lv),nm=expNames(PR(G.run))[lv-1];
  G.log.push({d:s.d,id:'exp'+lv,kind:'pos',title:both(()=>S('قرار توسّع: ','Expansion: ')+P2(nm)),chosen:0,cash0:s.cash-s.od,pre:before,review:null,post:after,impact:after-before,
    opts:[{t:both(()=>S('نفّذ التوسعة','Expand')),h:both(()=>S('تكلفة ','Cost ')+m(D.cost)),npv:after},{t:both(()=>S('لا توسّع','Do not expand')),h:both(()=>''),npv:before}]});
  track('expansion',{level:lv,project:G.run.project});expandFx(s,lv);G.tl.push({d:s.d,t:both(()=>S('بدأت توسعة: ','Expansion started: ')+P2(nm))});
  G.expHTML=null;refreshK();updateGame(true);if(wasRun)play();
}

/* result blocks */
function scnLine(){const pr=PR(G.run),x=pr.scns[G.run.scenario]||pr.scns.base;
  return G.run.hiddenScn?`<p class="note" style="margin:0 0 8px">🎲 ${S('السيناريو العشوائي كان','The random scenario was')}: <b>${P2(x.name)}</b> — ${P2(x.desc)}${G.daily?' • 📅 '+S('تحدي اليوم','Daily challenge'):''}</p>`:`<p class="note" style="margin:0 0 8px">${S('السيناريو','Scenario')}: <b>${P2(x.name)}</b></p>`}
function goalsResult(){const L=R.goals||[],st=L.filter(x=>x.st==='ok').length;return `<div class="card" style="margin-bottom:12px"><h3>${S('أهداف الجولة','Run goals')} ${'⭐'.repeat(st)}${'☆'.repeat(L.length-st)}</h3>${goalsHTML(L)}</div>`}
const repAt=f=>{const h=f.hist[Math.min(35,f.hist.length-1)];return h?n(Math.round(h.rep)+'/100'):'—'};
const crAt=f=>{const h=f.hist[Math.min(35,f.hist.length-1)];return h?ratingOf(h.cr):'—'};

ACH.push(
 {id:'rated',e:'💳',n:B('تقييم ائتماني ممتاز','Top credit rating'),d:B('انتهيت بتقييم A أو أعلى','Finished rated A or better'),test:s=>!s.dead&&s.cr>=70},
 {id:'trusted',e:'🤝',n:B('سمعة ذهبية','Golden reputation'),d:B('سمعة 85 أو أكثر','Reputation 85+'),test:s=>!s.dead&&s.rep>=85},
 {id:'builder',e:'🏗️',n:B('بنّاء','Builder'),d:B('أكملت التوسعة الكبرى','Completed the major expansion'),test:s=>s.expVis>=3},
 {id:'dealmaker',e:'📜',n:B('صانع صفقات','Deal maker'),d:B('قبلت عقدًا مؤسسيًا','Took on a corporate contract'),test:(s,run,pr,R,G)=>G.log.some(x=>/^ct/.test(x.id)&&x.chosen!==3)},
 {id:'stars3',e:'⭐',n:B('ثلاث نجوم','Three stars'),d:B('حققت كل أهداف الجولة','Hit every run goal'),test:(s,run,pr,R)=>(R.goals||[]).length>0&&R.goals.every(x=>x.st==='ok')});

/* random runs */
function startRandom(){cfg.scenario='random';startGame(Math.floor(Math.random()*4294967296))}
function surprise(){
  const ids=Object.keys(PROJECTS),pid=ids[Math.floor(Math.random()*ids.length)],pr=PROJECTS[pid],pick=a=>a[Math.floor(Math.random()*a.length)];
  cfg=cfgFor(pid);cfg.lineId=pick(Object.keys(pr.lines));cfg.siteId=pick(Object.keys(pr.sites));cfg.labor=pick(['lean','std','ext']);cfg.maint=pick(['low','std','high']);cfg.qc=pick(['low','std','high']);cfg.target=pick([0.7,0.8,0.9]);cfg.loan=pick(pr.finOpts);cfg.backup=FACP.indexOf(pid)>=0?pick(['yes','no']):'no';cfg.scenario='random';
  startGame(Math.floor(Math.random()*4294967296));
}
function dailyChallenge(){
  const d=new Date(),day=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000),ids=Object.keys(PROJECTS);
  cfg=cfgFor(ids[day%ids.length]);cfg.scenario='random';startGame(day*7919+13,{daily:true});
}
function shareX(){
  track('share_x');const pr=PR(G.run),a=R.act,st=(R.goals||[]).filter(x=>x.st==='ok').length,rt=ratingOf(G.s.cr),irr=a.irr==null?'—':(a.irr*100).toFixed(1)+'%';
  const stars='⭐'.repeat(st)+'☆'.repeat(3-st);
  const txt=S(`${G.daily?'📅 تحدي اليوم: ':''}جرّبت إطلاق ${P2(pr.name)} في محاكي G-Adwa: ${R.verdict}\nIRR ${irr} | NPV ${mt(a.npv)} | تقييم ائتماني ${rt} | ${stars}\nجرّب مشروعك قبل ما تدفع فلوسك الحقيقية 👇 #GAdwa #جدوتي`,`${G.daily?'📅 Daily challenge: ':''}I launched a ${P2(pr.name)} in the G-Adwa simulator: ${R.verdict}\nIRR ${irr} | NPV ${mt(a.npv)} | credit ${rt} | ${stars}\nTest your venture before risking real money 👇 #GAdwa`);
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(txt)+'&url='+encodeURIComponent(SITE_URL),'_blank','noopener');
}

render();
</script>
